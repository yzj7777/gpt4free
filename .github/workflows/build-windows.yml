name: build-windows-exe

# Builds the one-click Windows program on a real Windows runner and verifies it:
#   * dist/g4f-proxy.exe            single file, double-click to run
#   * dist/g4f-proxy-portable.zip   folder build, faster start
# Trigger it manually from the Actions tab, or push a v* tag.
#
# Artifacts require a GitHub login to download; set publish_release (or push a
# v* tag) and the same files are also attached to a Release, which is a plain
# public download link.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the exe to a GitHub Release (public download link)"
        type: boolean
        default: false
      release_tag:
        description: "Tag to release under (default: v0.0.0-win.<run number>)"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/win/requirements-win.txt

      - name: Build one-file exe
        env:
          G4F_ONEFILE: "1"
        run: >
          python -m PyInstaller packaging/win/g4f-proxy.spec
          --noconfirm --clean --distpath dist --workpath build/pyinstaller --log-level WARN

      - name: Build portable folder
        env:
          G4F_ONEFILE: "0"
        run: |
          python -m PyInstaller packaging/win/g4f-proxy.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller-onedir --log-level WARN
          Compress-Archive -Path dist\g4f-proxy\* -DestinationPath dist\g4f-proxy-portable.zip -CompressionLevel Optimal

      - name: Smoke test (credentials)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = & .\dist\g4f-proxy.exe --print --json 2>$null | Out-String
          if ($LASTEXITCODE -ne 0) { throw "exe exited with $LASTEXITCODE" }
          $cfg = $json | ConvertFrom-Json
          if (-not $cfg.base_url) { throw "no base_url in output:`n$json" }
          "base_url=$($cfg.base_url)"
          "api_key=$($cfg.api_key.Substring(0, 10))..."
          "routes=$($cfg.routes)"

      - name: Smoke test (server responds)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'srv.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'srv.err.log'
          $cfg = (& .\dist\g4f-proxy.exe --print --json 2>$null | Out-String) | ConvertFrom-Json
          "key file: $($cfg.key_file)"
          "base_url: $($cfg.base_url)"
          $port = ([uri]$cfg.base_url).Port
          $proc = Start-Process -FilePath .\dist\g4f-proxy.exe `
                    -ArgumentList '--no-copy', '--port', "$port" -PassThru -WindowStyle Hidden `
                    -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $ok = $false
            $lastError = ''
            for ($i = 0; $i -lt 360; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { throw "server exited early with $($proc.ExitCode)" }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/v1/models" `
                     -Headers @{ Authorization = "Bearer $($cfg.api_key)" } -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { $lastError = $_.Exception.Message }
            }
            if (-not $ok) { throw "no answer on port $port (last error: $lastError)" }
            $count = ($r.Content | ConvertFrom-Json).data.Count
            "GET /v1/models -> 200 with $count models"
          } catch {
            $msg = $_.Exception.Message
            Write-Host "::error::$msg"
            foreach ($f in @($out, $err)) {
              if (Test-Path $f) {
                "---- $f (tail) ----"
                $lines = Get-Content $f -Tail 30
                $lines | ForEach-Object { Write-Host "    $_" }
                if ($lines) { Write-Host "::error::$($lines -join ' | ')" }
              }
            }
            throw
          } finally {
            Get-Process g4f-proxy -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: g4f-proxy-windows-x64
          path: |
            dist/g4f-proxy.exe
            dist/g4f-proxy-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist\g4f-proxy.exe, dist\g4f-proxy-portable.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: Publish release
        if: ${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: g4f proxy ${{ inputs.release_tag || github.ref_name }}
          body: |
            One-click Windows build of the g4f OpenAI-compatible proxy.

            * `g4f-proxy.exe` — single file, double-click to run.
              Prints the API key, copies it to the clipboard, serves
              http://127.0.0.1:8080/v1
            * `g4f-proxy-portable.zip` — folder build, faster start, fewer
              antivirus false positives.
            * `SHA256SUMS.txt` — verify your download.

            DeepSeek Harness: `g4f-proxy.exe --dsh --set-default`
          files: |
            dist/g4f-proxy.exe
            dist/g4f-proxy-portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
